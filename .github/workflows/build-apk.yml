name: Build Android APK and Publish Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tee build_output.log

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-apks
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release-apks/CarVoiceAssistant-v1.0.0.apk \;
          ls -la release-apks/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarVoiceAssistant-v1.0.0
          path: release-apks/CarVoiceAssistant-v1.0.0.apk

      - name: Publish GitHub Release v1.0.0
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Car Voice Assistant v1.0.0"
          draft: false
          prerelease: false
          body: |
            ## المساعد الصوتي الهجين لشاشات سيارات BYD DiLink - الإصدار 1.0.0
            
            ### المميزات المضمنة في هذا الإصدار:
            - **معمارية أصلية 100% بلغة Kotlin:** بدون أي بيئة بايثون (Zero Python Runtime Overhead).
            - **العقل الهجين ثنائي المحركات:**
              - **المحرك A (موجه العتاد السريع):** ONNX Runtime 384D مع عتبة ثقة ≥ 70% لتنفيذ أوامر السيارة في أقل من 20ms.
              - **المحرك B (النموذج اللغوي الاحتياطي):** غلاف llama.cpp لنماذج GGUF مقيد بـ 2 إلى 3 أنوية معالج.
            - **الاستماع المستمر في الخلفية:** Foreground Service مع Vosk Wake Word ("يا سيارة").
            - **التحكم بعتاد السيارة:** نوايا التكييف، النوافذ، فتحة السقف، ومستوى الصوت وخفض صوت الوسائط (Audio Ducking).
            - **بروتوكول سياق النماذج (MCP):** أداة البحث المباشر في الويب وأداة قراءة الشاشة عبر AccessibilityService.
            - **السياق اللحظي والذاكرة:** موقع GPS دقيق عبر FusedLocationProvider وقاعدة بيانات Room للذاكرة RAG.
            - **معقم الصوت Piper TTS:** تنقية الماركداون والرموز التعبيرية وتحويل الرموز لكلمات عربية فصيحة.
            - **منتقي النماذج:** اختيار ملفات `.gguf` من ذاكرة التخزين ديناميكياً.
          files: release-apks/CarVoiceAssistant-v1.0.0.apk
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build_output.log
